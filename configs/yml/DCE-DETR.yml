output_dir: ./outputs/2-MOEMANet-FocusBIEBlock

print_freq: 1600
checkpoint_freq: 22

model: DEIM_MG

DEIM_MG:
  yaml_path: configs/cfg/DCE-DETR.yaml

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.0001
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.0001
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0002
  betas: [0.9, 0.999]
  weight_decay: 0.0001


# Increase to search for the optimal ema
epoches: 300 # 120 + 4n
train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: 288
  collate_fn:
    stop_epoch: 288
    ema_restart_decay: 0.9999
    base_size_repeat: ~
  total_batch_size: 4
val_dataloader:
  total_batch_size: 4
